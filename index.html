<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <div class="blog">
      <div class="blog__card">
        <img src="./assets/images/illustration-article.svg" alt="blog image" class="blog__image" loading="lazy">
        <div class="blog__data">
          <span class="blog__tag">Learning</span>
          <p class="blog__date">Published <time datetime="2023-12-21">21 Dec 2023</time></p>
          <h3 class="blog__title">HTML & CSS foundations</h3>
          <p class="blog__description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
        </div>
        <div class="blog__author">
          <img src="./assets/images/image-avatar.webp" alt="Greg Hooper" width="32" height="32" loading="lazy">
          <p class="blog__name">Greg Hooper</p>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
